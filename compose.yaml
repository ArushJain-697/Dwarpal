# Dev topology for Dwarpal.
#
# Only the proxy is published to the host (8080 proxy / 3000 admin). The
# backends, Postgres, and Redis sit on an internal network with no host route —
# the only way to reach them is *through* the proxy. That's the "proxy is the
# sole ingress" threat model in miniature.

networks:
  edge-net:
    driver: bridge
  app-net:
    internal: true # no route to the host

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dwarpal
      POSTGRES_PASSWORD: dwarpal
      POSTGRES_DB: dwarpal
    networks:
      - app-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dwarpal']
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    networks:
      - app-net
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  backend-a1:
    image: node:22-alpine
    working_dir: /app
    command: node dev/backend.js
    environment:
      BACKEND_NAME: A1
      BACKEND_PORT: 9001
    volumes:
      - ./backend/dev:/app/dev:ro
    networks:
      - app-net
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9001/healthz']
      interval: 5s
      timeout: 3s
      retries: 5

  backend-a2:
    image: node:22-alpine
    working_dir: /app
    command: node dev/backend.js
    environment:
      BACKEND_NAME: A2
      BACKEND_PORT: 9001
    volumes:
      - ./backend/dev:/app/dev:ro
    networks:
      - app-net
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9001/healthz']
      interval: 5s
      timeout: 3s
      retries: 5

  backend-b:
    image: node:22-alpine
    working_dir: /app
    command: node dev/backend.js
    environment:
      BACKEND_NAME: B
      BACKEND_PORT: 9001
    volumes:
      - ./backend/dev:/app/dev:ro
    networks:
      - app-net
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9001/healthz']
      interval: 5s
      timeout: 3s
      retries: 5

  proxy:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: node --watch src/index.js
    environment:
      PROXY_PORT: 8080
      ADMIN_PORT: 3000
      BACKEND_A_URL: http://backend-a1:9001,http://backend-a2:9001
      BACKEND_B_URL: http://backend-b:9001
      DATABASE_URL: postgres://dwarpal:dwarpal@postgres:5432/dwarpal
      REDIS_URL: redis://redis:6379
    ports:
      - '8080:8080'
      - '3000:3000'
    volumes:
      - ./backend:/app
      - /app/node_modules # keep the image's node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-a1:
        condition: service_started
      backend-a2:
        condition: service_started
      backend-b:
        condition: service_started
    networks:
      - edge-net # host-published ports
      - app-net # reach backends / pg / redis

  dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '5173:80'
    depends_on:
      - proxy
    networks:
      - edge-net # static assets; the browser talks to the admin port directly
